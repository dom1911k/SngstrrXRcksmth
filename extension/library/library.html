<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bass Trainer: library</title>
<link rel="stylesheet" href="library.css">
</head>
<body>
<header>
  <div class="brand">Bass Trainer <span>library</span></div>
  <input id="search" type="search" placeholder="Search songs…" autocomplete="off">
  <div class="spacer"></div>
  <a class="btn primary" href="../search/search.html">Find songs</a>
  <a class="btn" href="../player/player.html#drills">Drills</a>
  <a class="btn" href="../player/player.html">Player</a>
  <a class="small link" href="../updater/updater.html" target="_blank">Updates</a>
</header>
<main>
  <section id="setup" class="setup" hidden></section>
  <section id="hero" class="hero" hidden></section>
  <section id="tiles" class="tiles"></section>
  <section id="wantBox" hidden>
    <div class="head"><h2>Want to learn</h2><span class="small">Click a song to start learning it</span></div>
    <div id="wantShelf" class="shelf"></div>
  </section>
  <section id="overview" class="overview"></section>
  <section class="practice">
    <div class="head"><h2>Practice, last 12 months</h2><span id="practiceNote" class="small"></span></div>
    <div id="practiceChart" class="heat"></div>
  </section>
  <section id="dueBox" hidden>
    <div class="head"><h2>Due today</h2><span id="dueNote" class="small"></span></div>
    <div id="dueList" class="duelist"></div>
  </section>
  <section>
    <div class="head"><h2>Setlists</h2><span class="small">Your own lists; ▶ Play runs them in order with a running score</span></div>
    <div id="setlists" class="setlists"></div>
  </section>
  <section id="sessionsBox" hidden>
    <div class="head"><h2>Recent sessions</h2></div>
    <div id="sessions" class="sessions"></div>
  </section>
  <section id="songs">
    <div class="head"><h2>Songs</h2><div id="viewToggle" class="chips"></div></div>
    <div class="head">
      <div id="filters" class="chips"></div>
      <select id="group" title="Group the songs">
        <option value="none">No grouping</option><option value="tuning">By tuning</option><option value="artist">By artist</option><option value="status">By status</option>
      </select>
      <label class="small">Sort
        <select id="sort">
          <option value="recent">Last played</option>
          <option value="time">Most practised</option>
          <option value="best">Best score</option>
          <option value="added">Recently added</option>
          <option value="title">Title</option>
        </select>
      </label>
    </div>
    <div id="list" class="list"></div>
    <p id="empty" class="emptymsg" hidden></p>
  </section>
</main>
<aside id="detail" class="detail" hidden></aside>
<script type="module" src="../src/library-main.js"></script>
</body>
</html>
